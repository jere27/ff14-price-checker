<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF14 原価・販売数チェッカー</title>

<style>
body {
  font-family: "Segoe UI", "Noto Sans JP", sans-serif;
  background:#f4f6f8;
  padding:30px;
}
.container {
  max-width:860px;
  margin:auto;
}
h1 {
  text-align:center;
  margin-bottom:25px;
}
.controls {
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}
select, button {
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #ccc;
}
button {
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}
button:hover {
  background:#1e40af;
}
.card {
  background:white;
  border-radius:16px;
  padding:24px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.header {
  display:flex;
  gap:16px;
  align-items:center;
}
.header img {
  width:48px;
}
.note {
  color:#666;
  font-size:13px;
  margin:8px 0 14px;
}
.price-box {
  display:flex;
  gap:14px;
  margin-bottom:14px;
}
.price-item {
  background:#f1f5f9;
  border-radius:10px;
  padding:12px;
  flex:1;
}
.price-label {
  font-size:12px;
  color:#555;
}
.price-value {
  font-size:20px;
  font-weight:bold;
}
.material {
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid #eee;
}
.material img {
  width:28px;
}
.material span:last-child {
  margin-left:auto;
}
.sales {
  margin-top:10px;
  font-size:15px;
}
.profit {
  margin-top:18px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}
.plus { color:#16a34a; }
.minus { color:#dc2626; }
</style>
</head>

<body>
<div class="container">
<h1>FF14 原価・販売数チェッカー</h1>

<div class="controls">
  <select id="recipe">
    <option value="goryoku">剛力の宝薬G4</option>
    <option value="shinryoku">心力の宝薬G4</option>
    <option value="popcorn">キャラメルポップコーン</option>
  </select>

  <select id="dc">
    <option>Mana</option>
    <option>Gaia</option>
    <option>Elemental</option>
    <option>Meteor</option>
  </select>

  <button onclick="fetchAll()">価格取得</button>
</div>

<div id="result"></div>
</div>

<script>
const OUTPUT = 3;

/* レシピ定義（安定運用） */
const RECIPES = {
  goryoku: {
    result: { id:49234, name:"剛力の宝薬G4" },
    materials: [
      { id:49228, name:"イヨラエキス", qty:1 },
      { id:44051, name:"大聖水", qty:1 },
      { id:44039, name:"ウィンドパセリ", qty:1 },
      { id:46246, name:"紫電の霊砂", qty:1 }
    ]
  },
  shinryoku: {
    result: { id:49238, name:"心力の宝薬G4" },
    materials: [
      { id:49228, name:"イヨラエキス", qty:1 },
      { id:44051, name:"大聖水", qty:1 },
      { id:44043, name:"パールグラス", qty:1 },
      { id:46246, name:"紫電の霊砂", qty:1 }
    ]
  },
  popcorn: {
    result: { id:49240, name:"キャラメルポップコーン" },
    materials: [
      { id:49229, name:"フリントコーン", qty:1 },
      { id:43976, name:"トラルコーンオイル", qty:2 },
      { id:36080, name:"パームシュガー", qty:1 },
      { id:36255, name:"オウヴィボスの乳", qty:1 },
      { id:12895, name:"発酵バター", qty:1 },
      { id:46246, name:"紫電の霊砂", qty:1 }
    ]
  }
};

/* Universalis：価格平均 */
async function fetchAvg(dc, id) {
  const r = await fetch(`https://universalis.app/api/v2/${dc}/${id}`);
  const d = await r.json();
  const list = d.listings || [];
  if (!list.length) return 0;

  const hq = list.filter(l => l.hq);
  const use = hq.length ? hq : list;

  const prices = use
    .sort((a,b) => a.pricePerUnit - b.pricePerUnit)
    .slice(0,10)
    .map(i => i.pricePerUnit);

  return Math.round(prices.reduce((a,b)=>a+b,0) / prices.length);
}

/* Universalis：Mana DC 週間平均販売数 */
async function fetchWeeklyAverageSales(itemId) {
  const r = await fetch(`https://universalis.app/api/v2/Mana/${itemId}`);
  const d = await r.json();

  const now = Math.floor(Date.now() / 1000);
  const weekAgo = now - 7 * 86400;

  const total = (d.recentHistory || [])
    .filter(h => h.timestamp >= weekAgo)
    .reduce((s,h) => s + h.quantity, 0);

  return Math.round(total / 7);
}

/* XIVAPI：アイテム（IconHD優先） */
async function fetchItem(id) {
  const r = await fetch(`https://xivapi.com/item/${id}?language=ja`);
  return await r.json();
}

function iconUrl(item) {
  return "https://xivapi.com" + (item.IconHD || item.Icon);
}

async function fetchAll() {
  const dc = document.getElementById("dc").value;
  const recipe = RECIPES[document.getElementById("recipe").value];
  const result = document.getElementById("result");

  result.innerHTML = "取得中…";

  const resultItem = await fetchItem(recipe.result.id);
  const sell = await fetchAvg(dc, recipe.result.id);
  const weeklyAvg = await fetchWeeklyAverageSales(recipe.result.id);

  let cost = 0;
  let matsHTML = "";

  for (const m of recipe.materials) {
    const item = await fetchItem(m.id);
    const price = await fetchAvg(dc, m.id);
    cost += price * m.qty;

    matsHTML += `
      <div class="material">
        <img src="${iconUrl(item)}">
        ${m.name} ×${m.qty}
        <span>${price.toLocaleString()} ギル</span>
      </div>`;
  }

  const profit = sell * OUTPUT - cost;

  result.innerHTML = `
  <div class="card">
    <div class="header">
      <img src="${iconUrl(resultItem)}">
      <h2>${resultItem.Name}</h2>
    </div>

    <div class="note">※ 1回の制作で ${OUTPUT} 個完成</div>

    <div class="price-box">
      <div class="price-item">
        <div class="price-label">完成品相場（1個）</div>
        <div class="price-value">${sell.toLocaleString()} ギル</div>
      </div>
      <div class="price-item">
        <div class="price-label">原価（1回分）</div>
        <div class="price-value">${cost.toLocaleString()} ギル</div>
      </div>
    </div>

    <div class="sales">
      Mana DC 週間平均販売数：
      <b>${weeklyAvg}</b> 個 / 日
    </div>

    <h3>素材</h3>
    ${matsHTML}

    <div class="profit ${profit >= 0 ? "plus" : "minus"}">
      利益（1回分）：${profit.toLocaleString()} ギル
    </div>
  </div>`;
}
</script>
</body>
</html>
