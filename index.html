<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF14 原価・販売数チェッカー</title>

<style>
body {
  font-family: "Segoe UI", "Noto Sans JP", sans-serif;
  background:#f4f6f8;
  padding:30px;
}
.container {
  max-width:860px;
  margin:auto;
}
h1 {
  text-align:center;
  margin-bottom:25px;
}
.controls {
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}
select, button {
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #ccc;
}
button {
  background:#4f46e5;
  color:white;
  border:none;
  cursor:pointer;
}
button:hover {
  background:#4338ca;
}
.card {
  background:white;
  border-radius:16px;
  padding:24px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.header {
  display:flex;
  gap:16px;
  align-items:center;
}
.header img {
  width:48px;
}
.note {
  font-size:13px;
  color:#666;
}
.price-box {
  display:flex;
  gap:14px;
  margin:16px 0;
}
.price-item {
  background:#f1f5f9;
  border-radius:10px;
  padding:14px;
  flex:1;
}
.price-value {
  font-size:20px;
  font-weight:bold;
}
.material {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
.material img {
  width:28px;
}
.material span:last-child {
  margin-left:auto;
}
.sales {
  margin-top:10px;
}
.profit {
  margin-top:18px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}
.plus { color:#16a34a; }
.minus { color:#dc2626; }
</style>
</head>

<body>
<div class="container">

<h1>FF14 原価・販売数チェッカー</h1>

<div class="controls">
  <select id="recipe">
    <option value="goryoku">剛力の宝薬G4</option>
    <option value="shinryoku">心力の宝薬G4</option>
    <option value="popcorn">キャラメルポップコーン</option>
  </select>

  <select id="dc">
    <option>Mana</option>
    <option>Gaia</option>
    <option>Elemental</option>
    <option>Meteor</option>
  </select>

  <button onclick="fetchAll()">価格取得</button>
</div>

<div id="result"></div>
</div>

<script>
const OUTPUT = 3;

const RECIPES = {
  goryoku: {
    result:{ id:49234 },
    materials:[
      { id:49228, qty:1 },
      { id:44051, qty:1 },
      { id:44039, qty:1 },
      { id:46246, qty:1 }
    ]
  },
  shinryoku: {
    result:{ id:49238 },
    materials:[
      { id:49228, qty:1 },
      { id:44051, qty:1 },
      { id:44043, qty:1 },
      { id:46246, qty:1 }
    ]
  },
  popcorn: {
    result:{ id:49240 },
    materials:[
      { id:49229, qty:1 },
      { id:43976, qty:2 },
      { id:36080, qty:1 },
      { id:36255, qty:1 },
      { id:12895, qty:1 },
      { id:46246, qty:1 }
    ]
  }
};

async function fetchItem(id) {
  const r = await fetch(`https://xivapi.com/item/${id}?language=ja`);
  return await r.json();
}

function itemName(item) {
  return item.Name_ja || item.Name;
}

function iconUrl(item) {
  if (item.IconHD) return "https://xivapi.com" + item.IconHD;
  if (item.Icon) return "https://xivapi.com" + item.Icon;
  return "https://xivapi.com/i/000000/000405.png";
}

async function fetchAvg(dc, id) {
  const r = await fetch(`https://universalis.app/api/v2/${dc}/${id}`);
  const d = await r.json();
  if (!d.listings?.length) return 0;
  const prices = d.listings
    .sort((a,b)=>a.pricePerUnit-b.pricePerUnit)
    .slice(0,10)
    .map(i=>i.pricePerUnit);
  return Math.round(prices.reduce((a,b)=>a+b,0)/prices.length);
}

async function fetchWeeklySales(id) {
  const r = await fetch(`https://universalis.app/api/v2/Mana/${id}`);
  const d = await r.json();
  const now = Math.floor(Date.now()/1000);
  const weekAgo = now - 604800;
  const total = (d.recentHistory||[])
    .filter(h=>h.timestamp>=weekAgo)
    .reduce((s,h)=>s+h.quantity,0);
  return Math.round(total/7);
}

async function fetchAll() {
  const recipe = RECIPES[document.getElementById("recipe").value];
  const dc = document.getElementById("dc").value;
  const result = document.getElementById("result");
  result.innerHTML = "取得中…";

  const resultItem = await fetchItem(recipe.result.id);
  const sell = await fetchAvg(dc, recipe.result.id);
  const sales = await fetchWeeklySales(recipe.result.id);

  let cost = 0;
  let mats = "";

  for (const m of recipe.materials) {
    const item = await fetchItem(m.id);
    const price = await fetchAvg(dc, m.id);
    cost += price * m.qty;

    mats += `
      <div class="material">
        <img src="${iconUrl(item)}">
        ${itemName(item)} ×${m.qty}
        <span>${price.toLocaleString()} ギル</span>
      </div>`;
  }

  const profit = sell * OUTPUT - cost;

  result.innerHTML = `
  <div class="card">
    <div class="header">
      <img src="${iconUrl(resultItem)}">
      <h2>${itemName(resultItem)}</h2>
    </div>

    <div class="note">※ 1回の制作で ${OUTPUT} 個完成</div>

    <div class="price-box">
      <div class="price-item">
        完成品相場（1個）
        <div class="price-value">${sell.toLocaleString()} ギル</div>
      </div>
      <div class="price-item">
        原価（1回分）
        <div class="price-value">${cost.toLocaleString()} ギル</div>
      </div>
    </div>

    <div class="sales">
      Mana DC 週間平均販売数：<b>${sales}</b> 個 / 日
    </div>

    <h3>素材</h3>
    ${mats}

    <div class="profit ${profit>=0?"plus":"minus"}">
      利益（1回分）：${profit.toLocaleString()} ギル
    </div>
  </div>`;
}
</script>
</body>
</html>
